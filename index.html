<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Champs</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="shell">
  <header id="topbar">
    <div id="brand">TEMPO<span>CHAMPS</span></div>
    <nav id="tabs" aria-label="Sections">
      <button class="tab is-active" data-tab="athletes">Athletes</button>
      <button class="tab" data-tab="workouts">Workouts</button>
      <button class="tab" data-tab="groups">Groups</button>
    </nav>
    <select id="squad-sel" title="Squad" aria-label="Squad"></select>
    <button id="backup-btn" class="btn" title="Save everything to a file">Backup</button>
    <button id="restore-btn" class="btn" title="Load a backup file">Restore</button>
    <input id="restore-file" type="file" accept=".json,application/json" hidden>
    <button id="run-btn" class="btn primary">Run &#9654;</button>
  </header>
  <main id="main">
    <section id="tab-athletes" class="tab-panel"></section>
    <section id="tab-workouts" class="tab-panel" hidden></section>
    <section id="tab-groups" class="tab-panel" hidden></section>
  </main>
</div>

<div id="picker" hidden>
  <div id="picker-box" role="dialog" aria-modal="true" aria-label="Choose workout">
    <h2>Run a workout</h2>
    <div id="picker-list"></div>
    <div id="picker-actions">
      <button id="picker-print" class="btn" disabled title="Paper rack sheets for this workout">Print sheets</button>
      <button id="picker-cancel" class="btn">Cancel</button>
      <button id="picker-start" class="btn primary" disabled>Start</button>
    </div>
  </div>
</div>

<div id="run" class="phase-lift" hidden>
  <div id="rr-progress"><div id="rr-progress-fill"></div></div>
  <header id="rr-header">
    <div id="rr-title"></div>
    <div id="rr-left"></div>
    <div id="rr-hdr-btns">
      <button id="rr-minus30" class="iconbtn timebtn" title="Take 30s off this phase (Down)" aria-label="Minus 30 seconds">&minus;30</button>
      <button id="rr-plus30" class="iconbtn timebtn" title="Add 30s to this phase (Up)" aria-label="Plus 30 seconds">+30</button>
      <button id="rr-full" class="iconbtn" title="Fullscreen (F)" aria-label="Fullscreen">&#x26F6;</button>
      <button id="rr-pausebtn" class="iconbtn" title="Pause (Space)" aria-label="Pause">&#10074;&#10074;</button>
    </div>
  </header>
  <div id="rr-stage">
    <div id="rr-phaseword"></div>
    <div id="rr-exercise"></div>
    <div id="rr-setline"></div>
    <div id="rr-timer">0:00</div>
    <button id="rr-exit" class="btn primary" hidden>Exit</button>
  </div>
  <div id="rr-loadstrip" hidden></div>
  <div id="rr-grid"></div>
  <div id="rr-stations" hidden>
    <div id="rr-st-bar">
      <span id="rr-st-phase"></span>
      <span id="rr-st-time">0:00</span>
      <span id="rr-st-set"></span>
    </div>
    <div id="rr-st-racks"></div>
    <div id="rr-station-cards"></div>
  </div>
  <div id="rr-rot" hidden>
    <div id="rr-rot-bar">
      <span id="rr-rot-phase"></span>
      <span id="rr-rot-time">0:00</span>
      <span id="rr-rot-set"></span>
    </div>
    <div id="rr-rot-cards"></div>
  </div>
  <div id="rr-overlay" hidden>
    <div id="rr-paused-word">PAUSED</div>
    <div id="rr-paused-hint">Space resume &middot; D dim &middot; Esc exit</div>
    <div id="rr-roster"></div>
    <button id="rr-overlay-exit" class="btn">Exit</button>
  </div>
</div>

<div id="print"></div>

<script src="app.js"></script>
</body>
</html>
